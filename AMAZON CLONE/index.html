<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="navbar">
        <div class="logo">
            <h1>amazon</h1>
        </div>

        <input
            type="text"
            id="searchBox"
            placeholder="Search for products..."
        >

        <button class="nav-btn">Search</button>

        <button id="cartBtn" class="nav-btn">
            Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    
    <section id="cartSection" class="cart-section">
       
    </section>

    
    <section class="banner">
        <h2>Big Sale Today!</h2>
        <p>Up to 60% off on selected products</p>
        <button class="shop-btn">Shop Now</button>
    </section>

    
    <main class="products-container">

        <h2>Products</h2>

        <p id="productCount">
            Showing 0 products
        </p>

        <div id="productsGrid" class="products-grid">
            <!-- Products loaded by JavaScript -->
        </div>

        <p id="noProducts" class="no-products"></p>

    </main>

    
    <footer class="footer">
        <p>© 2026 Amazon Clone</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
