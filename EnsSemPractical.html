<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Factorial Calculator</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
  input { padding: 8px; font-size: 16px; width: 150px; }
  button { padding: 8px 16px; font-size: 16px; margin-left: 10px; cursor: pointer; }
  #result { margin-top: 20px; font-size: 20px; font-weight: bold; color: darkblue; }
</style>
</head>
<body>

  <h2>Factorial Calculator</h2>
  <input type="number" id="numInput" placeholder="Enter a number" min="0">
  <button onclick="calculateFactorial()">Calculate</button>

  <div id="result"></div>

  <script>
    function calculateFactorial() {
      let num = parseInt(document.getElementById("numInput").value);
      let resultDiv = document.getElementById("result");

      if (isNaN(num) || num < 0) {
        resultDiv.innerHTML = "Please enter a valid non-negative number.";
        return;
      }

      let factorial = 1;
      for (let i = 1; i <= num; i++) {
        factorial *= i;
      }

      resultDiv.innerHTML = "Factorial of " + num + " is " + factorial;
    }
  </script>

</body>
</html>
